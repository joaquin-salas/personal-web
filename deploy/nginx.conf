# Site server inside the container. TLS and the public domain are handled by the reverse proxy
# in front of it; this only serves the files in dist/.

# Astro puts hashed (content-addressed) assets in /_astro/, so they can be cached forever.
# Everything else, HTML above all, is revalidated so visitors always see the latest version.
map $uri $cache_control {
	~^/_astro/ "public, max-age=31536000, immutable";
	default "no-cache";
}

server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;

	# Behind the proxy, redirects such as /articles → /articles/ must be relative; otherwise nginx
	# would send visitors to its own internal address (http://…:8080).
	absolute_redirect off;
	server_tokens off;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript image/svg+xml application/json text/plain;

	add_header Cache-Control $cache_control always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location / {
		try_files $uri $uri/ =404;
	}
}
