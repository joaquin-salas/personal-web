<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="JS">
  <defs>
    <path id="full" d="M42 16 L42 62 C42 78 24 82 20 70 C17 60 32 56 46 54 C58 52 70 42 74 34 C70 26 58 26 55 34 C52 42 74 48 74 60 C73 72 60 78 50 72"/>
    <path id="loop" d="M20 70 C17 60 32 56 46 54 C58 52 70 42 74 34"/>
    <path id="s" d="M74 34 C70 26 58 26 55 34 C52 42 74 48 74 60 C73 72 60 78 50 72"/>
    <clipPath id="c1"><circle cx="42" cy="55" r="7"/></clipPath>
    <clipPath id="c2"><circle cx="64" cy="46" r="7"/></clipPath>
    <!-- Gap areas are 1 unit smaller than the redrawn strands so their edges overlap (no anti-alias seams). -->
    <clipPath id="g1"><circle cx="42" cy="55" r="6"/></clipPath>
    <clipPath id="g2"><circle cx="64" cy="46" r="6"/></clipPath>
    <mask id="gaps" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <rect x="-10" y="-10" width="120" height="120" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="8" stroke-linecap="round">
        <use href="#loop" clip-path="url(#g1)"/>
        <use href="#s" clip-path="url(#g2)"/>
      </g>
    </mask>
  </defs>
  <g class="ink" transform="translate(3.5 2)" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <use href="#full" mask="url(#gaps)"/>
    <use href="#loop" clip-path="url(#c1)"/>
    <use href="#s" clip-path="url(#c2)"/>
  </g>
</svg>
