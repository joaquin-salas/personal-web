# On every push to main: check the code, build the production image, push it to GHCR
# (ghcr.io/joaquin-salas/personal-web), then tell the server to pull it and restart the site.
name: Build

# The event that triggers the jobs
on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push makes an older, still-running build pointless.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Installs the pnpm version pinned in package.json ("packageManager") and caches its store.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the run's automatic GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: "latest" (what the server runs) and "sha-<commit>" (never moves, for rollbacks).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # arm64 for the server; amd64 to run the exact same image on a PC.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The key is restricted on the server (authorized_keys `restrict,command=...`) to one command:
      # pull the new image and recreate the container. So ssh sends no command, and -T asks for no
      # terminal. SSH_KNOWN_HOSTS pins the server's host keys, so an impostor makes the job fail.
      - name: Update the server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -T -o ConnectTimeout=15 ubuntu@51.170.45.46
